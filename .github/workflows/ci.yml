name: CI

on:
  push:
    branches: [main, master]

jobs:

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install


  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/clsp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install --legacy-peer-deps
      - run: npm run build